services:
  - type: web
    name: fastapi-server
    env: python
    rootDir: app/fastapi
    buildCommand: |
      # Check if Rust is already available
      if command -v cargo >/dev/null 2>&1; then
        echo "✓ Rust already installed at: $(which cargo)"
        export PATH="/usr/local/cargo/bin:$PATH"
      else
        echo "Installing Rust to $HOME/.cargo..."
        export CARGO_HOME="$HOME/.cargo"
        export RUSTUP_HOME="$HOME/.rustup"
        export PATH="$CARGO_HOME/bin:$PATH"
        mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        source "$CARGO_HOME/env"
      fi
      pip install --upgrade pip setuptools wheel
      pip install maturin
      pip install -r requirements.txt
    startCommand: uvicorn index:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HUME_API_KEY
        sync: false
      # Add more env vars as needed in Render Dashboard
